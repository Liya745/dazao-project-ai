server:
  address: 127.0.0.1
  port: 8099
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
      timeout: 8h
spring:
  application:
    name: dazao-character
  datasource:
    url: jdbc:h2:file:./data/studio;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
studio:
  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
    model: ${AI_MODEL:deepseek-chat}
logging:
  level:
    dev.langchain4j: WARN
