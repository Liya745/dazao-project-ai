# 替换大枣专用入口片段；宿主机现有 server 和 Saya 的 location 保持原字节。
location = /dzproject {
    return 308 /dzproject/$is_args$args;
}
location = /dzproject/api/auth/register {
    limit_req zone=dzstudio_register burst=2 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/dazao-character.proxy.conf;
}
location = /dzproject/api/auth/login {
    limit_req zone=dzstudio_login burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/dazao-character.proxy.conf;
}
location = /dzproject/api/characters/generate {
    limit_req zone=dzstudio_generate burst=2 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/dazao-character.proxy.conf;
}
location ^~ /dzproject/ {
    include /etc/nginx/snippets/dazao-character.proxy.conf;
}
